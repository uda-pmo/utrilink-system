<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriLink | 代工协同中心</title><link rel="stylesheet" href="/styles.css"></head><body><div id="auth" class="auth"><section><div class="brand"><i>N</i>NutriLink</div><h1>代工协同中心</h1><p>登录后统一管理合同、生产节点与归档文件。</p><form id="authForm"><label>姓名（首次注册）<input name="name" placeholder="林雨"></label><label>工作邮箱<input type="email" name="email" required placeholder="you@company.com"></label><label>密码<input type="password" name="password" required minlength="8" placeholder="至少 8 位"></label><button>登录</button><button type="button" class="secondary" id="register">创建账号</button><small id="authError"></small></form></section></div><div id="app" hidden><aside><div class="brand"><i>N</i>NutriLink</div><p>跨境保健品代工协同</p><button class="nav active" data-page="orders">代工订单</button><button class="nav" data-page="files">文档归档</button><div class="account"><b id="who"></b><button id="logout">退出登录</button></div></aside><main><header><div><b>代工订单</b><span>合同与生产资料统一留存</span></div><button id="newOrder">+ 新建代工订单</button></header><section id="content"></section></main></div><dialog id="modal"><form id="orderForm"><div class="modalHead"><h2 id="modalTitle">新建代工订单</h2><button type="button" class="close" id="closeModal">x</button></div><div class="grid"><label>合同号 *<input name="contract_no" required></label><label>工厂名称 *<input name="factory_name" required></label><label>批号<input name="batch_no"></label><label>产品 SKU *<input name="sku" required></label><label>当前节点<input name="node" placeholder="例如：原料进厂验收"></label><label>约定交期<input type="date" name="due_date"></label><label>生产数量<input name="quantity"></label><label>整体进度 (%)<input type="number" min="0" max="100" name="progress" value="0"></label><label>订单状态<input name="status" value="待确认"></label><label>配方版本<input name="formula_version"></label><label>包装规格<input name="pack_spec"></label><label>生产日期<input type="date" name="production_date"></label><label>保质期<input name="shelf_life"></label><label>到期日期<input type="date" name="expiry_date"></label><label class="wide">完整配方<textarea name="formula"></textarea></label></div><footer><button type="button" class="secondary" id="cancel">取消</button><button>保存订单</button></footer></form></dialog><dialog id="detail"><div id="detailBody"></div></dialog><script src="/app.js?v=20260805"></script></body></html>
