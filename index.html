<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriLink | 代工协同中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="detail.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">N</span><span>NutriLink</span></div>
        <div class="workspace-label">跨境保健品代工协同</div>
        <nav>
          <button class="nav-item active" data-view="dashboard"><span>▦</span>工作看板</button>
          <button class="nav-item" data-view="orders"><span>▤</span>代工订单</button>
          <button class="nav-item" data-view="documents"><span>▧</span>文档归档</button>
          <button class="nav-item" data-view="partners"><span>◎</span>互联工厂</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="role-switcher">
            <span class="tiny-label">当前身份</span>
            <select id="roleSelect"><option value="brand">品牌方 · PMO</option><option value="factory">工厂方 · 韩国 Hanwell</option></select>
          </div>
          <div class="profile"><div class="avatar">LY</div><div><b>林雨</b><small>Brand Operations</small></div><button aria-label="设置">•••</button></div>
        </div>
      </aside>

      <main>
        <header class="topbar"><div class="crumb" id="crumb">工作看板 <span>/</span> 全部订单</div><div class="header-actions"><select class="language-select" id="langSelect" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ko">한국어</option></select><button class="icon-button" title="通知">♧<i></i></button><button class="help">帮助中心</button><button class="primary" id="newOrderBtn">＋ 新建代工订单</button></div></header>
        <div id="app"></div>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <section class="modal" id="modal"></section>
    </div>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
