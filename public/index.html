<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NutriLink | 代工协同中心</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="auth" class="auth">
    <form id="authForm" class="auth-card">
      <div class="brand"><i>N</i><span>NutriLink</span></div>
      <h1>代工协同中心</h1>
      <p>登录后统一管理合同、生产节点与归档文件。</p>
      <label>姓名（首次注册）<input name="name" placeholder="林雨"></label>
      <label>工作邮箱<input name="email" type="email" required placeholder="you@company.com"></label>
      <label>密码<input name="password" type="password" required minlength="8" placeholder="至少 8 位"></label>
      <button type="submit" class="primary">登录</button>
      <button type="button" id="register" class="secondary">创建账号</button>
      <small id="authError"></small>
    </form>
  </section>

  <div id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><i>N</i><span>NutriLink</span></div>
      <p class="workspace-label">跨境保健品代工协同</p>
      <nav aria-label="主导航">
        <button class="nav active" data-view="dashboard">工作看板</button>
        <button class="nav" data-view="orders">代工订单</button>
        <button class="nav" data-view="documents">文档归档</button>
        <button class="nav" data-view="factories">互联工厂</button>
      </nav>
      <div class="account"><b id="who"></b><small id="role"></small><button id="logout">退出登录</button></div>
    </aside>
    <main>
      <header class="topbar">
        <div><b id="crumb">工作看板</b><span id="subtitle">实时追踪跨境代工订单与合规文件状态</span></div>
        <div class="header-actions"><button id="export" class="outline" title="导出当前列表">导出</button><button id="newOrder" class="primary">+ 新建代工订单</button></div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <dialog id="orderModal" class="modal"><form id="orderForm"></form></dialog>
  <dialog id="detailModal" class="modal detail-modal"><div id="detailBody"></div></dialog>
  <script src="/app.js"></script>
</body>
</html>
